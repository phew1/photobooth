    if (kind === 'strip') { c.label = `Strip No. ${canvas.stripNo}`; c.file = `silver-booth-strip-${canvas.stripNo}.png`; }
    else { photoCount++; c.label = `Photo ${photoCount}`; c.file = `silver-booth-${e.id}-${p2(photoCount)}.png`; }
    c.pin = { type: 'capture', c, el: capturePinEl(c), ar: canvas.height / canvas.width, text: `${c.label} ${e.name} ${kind} your pins you`.toLowerCase() };
    captures.unshift(c);
    renderMine();
    return c;
  }

  function askDelete(on) {
    $('delBtn').hidden = on; $('delAsk').hidden = !on; $('delYes').hidden = !on; $('delNo').hidden = !on;
  }
  $('delBtn').addEventListener('click', () => askDelete(true));
  $('delNo').addEventListener('click', () => askDelete(false));
  $('delYes').addEventListener('click', () => {
    const i = captures.indexOf(capCurrent);
    if (i >= 0) captures.splice(i, 1);
    toast('Pin deleted.');
    goBack();
  });

  const CANT_SAVE = 'Downloading isn’t available here. Press and hold (or right-click) the image to save it.';
  async function saveCapture(c) {
    const blob = await new Promise(r => c.canvas.toBlob(r, 'image/png'));
    if (!blob) { toast('That image couldn’t be prepared. Try again.'); return; }
    if (inViewer) {
      const dl = await downloadsP;
      if (!dl) { toast(CANT_SAVE); return; }
      try { await dl.save({ filename: c.file, data: blob }); toast(`Saved ${c.file}.`); }
      catch (e) {
        const code = e && e.code;
        toast(code === 'declined' ? 'Download cancelled.' : code === 'rate_limited' ? 'A download is already waiting for your answer.' : CANT_SAVE);
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = c.file;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      toast(`Saved ${c.file} to your downloads.`);
    }
  }

  // ---------- Keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (media.classList.contains('immersive')) exitImmersive();
      else if (view !== 'feed') goBack();
    } else if ((e.code === 'Space' || e.key === ' ') && view === 'effect') {
      const tag = e.target && e.target.tagName;
      if (tag !== 'BUTTON' && tag !== 'INPUT') { e.preventDefault(); take(); }
    }
  });

  // =====================================================================
  // Main loop: the close-up effect when one is open, otherwise every pin in the feed.
  // =====================================================================
  let lastTileAt = 0, stillFrames = 0;
  function stepTiles(t) {
    for (const k in tileSrcs) drawSource(tileSrcs[k], t);
    for (const p of effectPins) if (p.el.isConnected) p.fx.step(tileSrcs[p.key], t);
  }
  function loop(ts) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    const t = ts / 1000;
    if (view === 'effect' && viewFx) {
      const [w, h] = viewDims();
      if (w !== viewSrc.w || h !== viewSrc.h) buildView();
      drawSource(viewSrc, t);
      viewFx.step(viewSrc, t, viewFx.interactive ? gatherInputs() : undefined);
      return;
    }
    if (view !== 'feed') return;
    if (ts - lastTileAt < 50) return;   // feed pins refresh about 20 times a second
    if (reduceMotion && !camOn && stillFrames > 45) return;
    lastTileAt = ts;
    stillFrames = camOn ? 0 : stillFrames + 1;
    stepTiles(t);
  }

  // ---------- Light / dark ----------
  let dark = document.documentElement.getAttribute('data-look') === 'dark';
  function renderLook() {
    document.documentElement.setAttribute('data-look', dark ? 'dark' : 'light');
    $('lookBtn').setAttribute('aria-pressed', String(dark));
    $('lookBtn').title = dark ? 'Switch to light mode' : 'Switch to dark mode';
    $('moonIcon').toggleAttribute('hidden', dark);
    $('sunIcon').toggleAttribute('hidden', !dark);
  }
  $('lookBtn').addEventListener('click', () => {
    dark = !dark;
    store('silverbooth.look', dark ? 'dark' : 'light');
    renderLook();
  });

  // ---------- Start ----------
  renderLook();
  renderSound();
  setMode('photo');
  onSourceChange();
  renderFeed();
  for (let i = 0; i < 24; i++) {   // warm up so every pin has a picture before the first paint
    const t = i / 20;
    for (const k in tileSrcs) drawSource(tileSrcs[k], t);
    for (const p of effectPins) p.fx.step(tileSrcs[p.key], t);
  }
  route();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
