<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Silver Booth: camera effects you play with your hands.">
</head>
<body>
<title>Silver Booth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a white home page with a full-width wordmark, labelled sections and square effect tiles.
   Tapping a tile opens the camera full screen straight away, with the controls at its edges.
   The home page is deliberately light only; the camera screen is always dark. */
:root {
  color-scheme: light;
  --paper: #FFFFFF;
  --ink: #0A0A0A;
  --muted: #6B6B6B;
  --rule: #0A0A0A;
  --tile: #1A1714;
  --on-dark: #FFFFFF;
  --live: #F0953C;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html.locked, html.locked body { overflow: hidden; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }
button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }
.cam-feed { position: fixed; left: 0; top: 0; width: 2px; height: 2px; opacity: 0; pointer-events: none; }

/* ---------- Home ---------- */
.mast {
  padding-top: 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.logo {
  margin: 0;
  display: flex;
  justify-content: space-between;
  gap: .25em;
  font-weight: 800;
  font-stretch: 112%;
  font-size: clamp(40px, 11vw, 150px);
  line-height: .9;
  letter-spacing: -.01em;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
}
.wrap {
  max-width: 1124px;
  margin: 0 auto;
  padding-block: 34px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 30px;
}
.about { margin: 0; font-size: 13px; max-width: 70ch; }
.sec { display: grid; gap: 12px; }
.sec-head {
  margin: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.sec-head::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 172px));
  gap: 12px;
}
@media (max-width: 560px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}
.tile {
  position: relative;
  aspect-ratio: 1;
  max-width: 100%;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: var(--tile);
  overflow: hidden;
  cursor: pointer;
  text-align: left;
  color: var(--on-dark);
}
.tile canvas, .tile img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .5s cubic-bezier(.2, .7, .2, 1);
}
.tile:hover canvas, .tile:hover img { transform: scale(1.04); }
.tile::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0, 0, 0, .55), rgba(0, 0, 0, 0) 50%);
  pointer-events: none;
}
.tile-text { position: absolute; left: 10px; right: 10px; bottom: 9px; z-index: 1; display: grid; gap: 1px; }
.tile-name {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.05;
  text-shadow: 0 1px 4px rgba(0, 0, 0, .55);
  overflow-wrap: anywhere;
}
.tile-sub {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .6);
}
.foot { margin: 0; font-size: 12px; color: var(--muted); }

/* ---------- Camera screen ---------- */
.cam {
  position: fixed; inset: 0;
  z-index: 50;
  background: #000000;
  color: var(--on-dark);
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.stage canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  touch-action: none;
}
.more {
  position: absolute; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: max(10px, env(safe-area-inset-left, 0px));
  padding: 4px 2px;
  border: 0;
  background: none;
  color: var(--on-dark);
  font-size: 15px;
  cursor: pointer;
  text-shadow: 0 1px 4px rgba(0, 0, 0, .7);
}
.help {
  position: absolute; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  right: max(14px, env(safe-area-inset-right, 0px));
  width: 30px; height: 30px;
  display: grid; place-items: center;
  padding: 0;
  border: 1.5px solid var(--on-dark);
  border-radius: 50%;
  background: rgba(0, 0, 0, .2);
  color: var(--on-dark);
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.help-panel {
  position: absolute; z-index: 4;
  top: calc(env(safe-area-inset-top, 0px) + 54px);
  right: max(14px, env(safe-area-inset-right, 0px));
  width: min(300px, calc(100% - 28px));
  display: grid;
  gap: 12px;
  padding: 14px;
  background: rgba(0, 0, 0, .72);
  font-size: 14px;
}
.help-panel p { margin: 0; }
.help-row { display: flex; flex-wrap: wrap; gap: 8px; }
.box {
  padding: 9px 14px;
  border: 1px solid var(--on-dark);
  border-radius: 0;
  background: rgba(0, 0, 0, .25);
  color: var(--on-dark);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  white-space: nowrap;
}
.box:hover { background: rgba(255, 255, 255, .14); }
.bottom-left, .bottom-right {
  position: absolute; z-index: 3;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.bottom-left { left: max(14px, env(safe-area-inset-left, 0px)); align-items: flex-start; }
.bottom-right { right: max(14px, env(safe-area-inset-right, 0px)); align-items: flex-end; }
.thumb {
  width: 48px; height: 48px;
  padding: 0;
  border: 2px solid var(--on-dark);
  background: #222 center / cover no-repeat;
  cursor: pointer;
}
.shutter {
  position: absolute; z-index: 3;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  transform: translateX(-50%);
  width: 70px; height: 70px;
  padding: 0;
  border: 4px solid var(--on-dark);
  border-radius: 50%;
  background: transparent;
  box-shadow: 0 2px 12px rgba(0, 0, 0, .35);
  cursor: pointer;
  transition: transform .1s, background-color .15s;
}
.shutter:active:not(:disabled) { transform: translateX(-50%) scale(.92); background: rgba(255, 255, 255, .25); }
.shutter.strip { border-color: var(--live); }
.shutter:disabled { opacity: .5; }
.cam-status {
  position: absolute; z-index: 2;
  left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: min(440px, calc(100% - 40px));
  margin: 0;
  text-align: center;
  font-size: 17px;
  text-shadow: 0 1px 6px rgba(0, 0, 0, .8);
  pointer-events: none;
}
.lamps {
  position: absolute; z-index: 3;
  top: calc(env(safe-area-inset-top, 0px) + 18px);
  left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 8px;
}
.lamps i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--on-dark); }
.lamps i.on { background: var(--live); border-color: var(--live); }
.lamps i.now { border-color: var(--live); animation: blink .8s steps(2, jump-none) infinite; }
@keyframes blink { 50% { border-color: transparent; } }
.count {
  position: absolute; inset: 0; z-index: 2;
  display: grid; place-items: center;
  font-size: clamp(120px, 26vw, 260px);
  font-weight: 800;
  line-height: 1;
  text-shadow: 0 6px 40px rgba(0, 0, 0, .6);
  pointer-events: none;
}
.count.tick { animation: tick .8s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes tick {
  0% { opacity: 0; transform: scale(1.35); }
  25% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: .1; transform: scale(.94); }
}
.flash { position: absolute; inset: 0; z-index: 5; background: #FFFFFF; opacity: 0; pointer-events: none; }
.flash.go { animation: flash .5s ease-out both; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.toast {
  position: absolute; z-index: 4;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  transform: translateX(-50%);
  max-width: calc(100% - 32px);
  padding: 8px 14px;
  background: rgba(0, 0, 0, .6);
  font-size: 13px;
  text-align: center;
  opacity: 0;
  transition: opacity .2s;
  pointer-events: none;
}
.toast.show { opacity: 1; }

/* ---------- Photo viewer ---------- */
.viewer {
  position: fixed; inset: 0;
  z-index: 70;
  display: grid;
  place-items: center;
  align-content: center;
  gap: 14px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: rgba(0, 0, 0, .94);
  color: var(--on-dark);
}
.viewer img { display: block; max-width: 100%; max-height: 72vh; object-fit: contain; }
.view-cap { margin: 0; font-family: var(--mono); font-size: 12px; color: rgba(255, 255, 255, .7); text-align: center; }
.view-actions { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; }
.view-msg { margin: 0; min-height: 1.5em; font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) {
  .count.tick, .flash.go, .lamps i.now { animation: none !important; }
  .tile canvas, .tile img { transition: none; }
}
</style>

<video id="video" class="cam-feed" playsinline muted autoplay aria-hidden="true"></video>

<header class="mast">
  <h1 class="logo" id="logo" aria-label="Silver Booth"><span>Silver</span><span>Booth</span></h1>
</header>
<main class="wrap" id="home">
  <p class="about">Silver Booth makes camera effects you play with your hands. Pick one and your camera opens.</p>
  <section class="sec" aria-labelledby="secPlay">
    <h2 class="sec-head" id="secPlay">Play</h2>
    <div class="tiles" id="tilesPlay"></div>
  </section>
  <section class="sec" id="photosSec" aria-labelledby="secPhotos" hidden>
    <h2 class="sec-head" id="secPhotos">Your photos</h2>
    <div class="tiles" id="tilesPhotos"></div>
  </section>
  <p class="foot">Everything runs in your browser. Photos stay on your device until you save them.</p>
</main>

<section class="cam" id="cam" hidden aria-label="Camera">
  <div class="stage" id="stage"></div>
  <div class="count" id="count" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <p class="cam-status" id="camStatus" role="status" aria-live="polite"></p>
  <div class="lamps" id="lamps" hidden aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="more" id="moreBtn" type="button">&lt; more effects</button>
  <button class="help" id="helpBtn" type="button" aria-label="How to play" aria-expanded="false" aria-controls="helpPanel">?</button>
  <div class="help-panel" id="helpPanel" hidden>
    <p id="helpText"></p>
    <div class="help-row">
      <button class="box" id="stripBtn" type="button" aria-pressed="false">Strip: OFF</button>
      <button class="box" id="soundBtn" type="button">Sound: ON</button>
      <button class="box" id="resetBtn" type="button">Refill all</button>
      <button class="box" id="soberBtn" type="button">Sober up</button>
    </div>
  </div>
  <div class="bottom-left">
    <button class="thumb" id="thumbBtn" type="button" hidden aria-label="Open your last photo"></button>
  </div>
  <button class="shutter" id="shutter" type="button" aria-label="Take a photo"></button>
  <div class="bottom-right">
    <button class="box" id="flipBtn" type="button" hidden>Camera: Front</button>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</section>

<section class="viewer" id="viewer" hidden aria-label="Photo">
  <img id="viewImg" alt="">
  <p class="view-cap" id="viewCap"></p>
  <div class="view-actions">
    <button class="box" id="saveBtn" type="button">Save</button>
    <button class="box" id="delBtn" type="button">Delete</button>
    <span id="delAsk" hidden>Delete this photo?</span>
    <button class="box" id="delYes" type="button" hidden>Yes, delete</button>
    <button class="box" id="delNo" type="button" hidden>Keep</button>
    <button class="box" id="closeView" type="button">Close</button>
  </div>
  <p class="view-msg" id="viewMsg" role="status" aria-live="polite"></p>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
  const DISPLAY = '"Archivo", system-ui, sans-serif';
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  // Inside the Claude artifact viewer the camera is off, so the bottles can only be dragged there.
  const inViewer = !!(window.claude && typeof window.claude.use === 'function');
  const hasMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
  const downloadsP = inViewer ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
  const store = (k, v) => {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ }
    return null;
  };
  const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const p2 = n => String(n).padStart(2, '0');
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

  // ---------- state shared with the effect code ----------
  let view = 'home', current = null;
  let stream = null, camOn = false, camState = 'off', facing = 'user', multiCam = false;
  const video = $('video');

  // ---------- sound ----------
  let actx = null, soundOn = store('silverbooth.sound') !== 'off';
  function audio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
    if (actx && actx.state === 'suspended') actx.resume().catch(() => {});
    return actx;
  }
  function beep(freq) {
    if (!soundOn) return; const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + 0.12);
  }
  function shutterSound() {
    if (!soundOn) return; const a = audio(); if (!a) return;
    const t = a.currentTime, len = Math.floor(a.sampleRate * 0.16), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (i < len * 0.3 ? 1 : 0.45);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.frequency.value = 2600; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.16);
    s.connect(f).connect(g).connect(a.destination); s.start(t);
  }

  let toastTimer = 0;
  function toast(t) {
    const el = $('toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
  }

  // =====================================================================
  // Inuman: an interactive effect. Soju and beer bottles are drawn into the camera picture.
  // Close your hand on one to grab it (it follows your hand), tilt your hand to pour.
  // =====================================================================
  const DRINKS = [
    // strength is how much one glass counts toward getting drunk (beer = 1); capacity is in glasses
    { name: 'SOJU', liquid: [228, 246, 232], alpha: 0.6, strength: 2.5, capacity: 1.4,
      glass: [58, 150, 78], inBottle: [36, 128, 62], cap: '#2F7D3F', label: '#F4F7F1', ink: '#1F5E2E', band: '#D23B2E',
      size: 0.95, ar: 0.3, neck: 0.3, crown: false },
    { name: 'BEER', liquid: [226, 160, 34], alpha: 0.9, strength: 1, capacity: 1.4, foam: true,
      glass: [118, 64, 22], inBottle: [176, 104, 18], cap: '#C9A227', label: '#F3E6C8', ink: '#9E2A1F', band: '#9E2A1F',
      size: 1.02, ar: 0.29, neck: 0.4, crown: true }
  ];
  const zeros = () => DRINKS.map(() => 0);
  const BODY = '"Archivo", system-ui, -apple-system, sans-serif';
  const HAND_LINKS = [[0, 1], [1, 2], [2, 3], [3, 4], [0, 5], [5, 6], [6, 7], [7, 8], [5, 9], [9, 10], [10, 11], [11, 12],
    [9, 13], [13, 14], [14, 15], [15, 16], [13, 17], [17, 18], [18, 19], [19, 20], [0, 17]];
  const TAU = Math.PI * 2;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rgbStr = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
  const ease = u => u * u * (3 - 2 * u);

  function makeInuman(w, h, opts = {}) {
    const demo = !!opts.demo;
    const canvas = mk(w, h), ctx = canvas.getContext('2d');
    const overlay = demo ? null : mk(w, h), octx = overlay && overlay.getContext('2d');
    if (overlay) overlay.style.pointerEvents = 'none';
    const unit = Math.min(h * 0.33, w * 0.17);                // tallest bottle
    const gh = unit * 0.6, gw = gh * 0.52;                     // glass size
    // everything stands a little above the bottom edge, so a hand can reach it without leaving the picture
    const margin = Math.max(6, w * 0.018), floor = h - Math.max(margin, h * 0.13);
    const TILT = 2.0, POUR_AT = 1.25;                          // auto-pour angle for mouse/finger; angle where pouring starts
    const BASE = gh * 0.1, DEPTH = gh * 0.84;

    const GP = new Path2D(), gt = gw / 2, gb = gw * 0.42, gr = gw * 0.08;
    GP.moveTo(-gt, -gh / 2); GP.lineTo(gt, -gh / 2); GP.lineTo(gb, gh / 2 - gr);
    GP.quadraticCurveTo(gb, gh / 2, gb - gr, gh / 2); GP.lineTo(-gb + gr, gh / 2);
    GP.quadraticCurveTo(-gb, gh / 2, -gb, gh / 2 - gr); GP.closePath();

    // Bottle shapes, built once per drink in the bottle's own coordinates (centred on 0,0)
    const shapes = DRINKS.map(d => {
      const bh = unit * d.size, bw = bh * d.ar, hw = bw / 2, nw = bw * 0.19, top = -bh / 2, bot = bh / 2, rr = bw * 0.16;
      const neckTop = top + bh * 0.07, shoulder = -bh * (0.5 - d.neck - 0.16), neckBase = top + bh * d.neck;
      const P = new Path2D();
      P.moveTo(-hw + rr, bot); P.lineTo(hw - rr, bot); P.quadraticCurveTo(hw, bot, hw, bot - rr);
      P.lineTo(hw, shoulder); P.bezierCurveTo(hw, neckBase + bh * 0.06, nw, neckBase + bh * 0.03, nw, neckBase);
      P.lineTo(nw, neckTop); P.lineTo(-nw, neckTop); P.lineTo(-nw, neckBase);
      P.bezierCurveTo(-nw, neckBase + bh * 0.03, -hw, neckBase + bh * 0.06, -hw, shoulder);
      P.lineTo(-hw, bot - rr); P.quadraticCurveTo(-hw, bot, -hw + rr, bot); P.closePath();
      return { P, bh, bw, hw, nw, top, bot, neckTop, shoulder };
    });

    // four bottles on the left (soju, beer, soju, beer), three plain glasses on the right
    let cursor = margin;
    const bottles = [0, 1, 0, 1].map(di => {
      const d = DRINKS[di], s = shapes[di], hx = cursor + s.bw / 2, hy = floor - s.bh / 2;
      cursor += s.bw * 1.32;
      return { kind: 'bottle', d, di, s, bw: s.bw, bh: s.bh, hx, hy, x: hx, y: hy, tx: hx, ty: hy, rot: 0, want: 0,
        held: null, byHand: false, a0: 0, off: { x: 0, y: 0 }, pouring: false, pourInto: null, landX: 0, landY: 0,
        amount: d.capacity, emptyFor: 0 };
    });
    const glasses = [0, 1, 2].map(i => {
      const hx = w - margin - gw * 0.6 - (2 - i) * gw * 1.25, hy = floor - gh / 2;
      return { kind: 'glass', hx, hy, x: hx, y: hy, tx: hx, ty: hy, rot: 0, want: 0, held: null, byHand: false, a0: 0,
        off: { x: 0, y: 0 }, fill: 0, amounts: zeros(), color: [255, 255, 255], alpha: 0.5, fullFor: 0, bubbles: [],
        pouring: false, drinking: false, mouth: null, landX: 0, landY: 0 };
    });
    const drops = [];
    let touched = false;
    // drinking and getting drunk
    let face = null, units = 0, nowT = 0, gulpT = -9, hicT = -9, nextHic = 0;
    const tmp = demo ? null : mk(w, h);
    const foamShare = g => g.fill > 0 ? g.amounts.reduce((s, a, i) => s + (DRINKS[i].foam ? a : 0), 0) / g.fill : 0;
    const drunkness = () => clamp((units - 1.5) / 2.5, 0, 1);   // tipsy at two beers, drunk at three, wasted at four
    const nearMouth = p => !!(face && dist(p, face.mouth) < face.size * 0.45);
    function drink(amount, shares) {
      let s = 0;
      for (let i = 0; i < DRINKS.length; i++) s += shares[i] * DRINKS[i].strength;
      units += amount * s;
      if (!demo && soundOn && nowT - gulpT > 0.38) { gulpT = nowT; gulp(); }
    }

    // ---- input: grab (fist, pinch or press), carry, let go ----
    const prevDown = {}, holds = {}, lastSeen = {};
    function pick(p) {
      const loose = !!p.hand;
      let best = null, bd = Infinity;
      // a hand gets a generous grab zone around each bottle and glass
      for (const b of bottles) {
        if (b.held) continue;
        const dx = Math.abs(p.x - b.x), dy = Math.abs(p.y - b.y);
        const rx = loose ? Math.max(b.bw * 1.9, unit * 0.2) : b.bw * 0.95, ry = b.bh * (loose ? 0.85 : 0.55);
        if (dx < rx && dy < ry && dx + dy * 0.5 < bd) { bd = dx + dy * 0.5; best = b; }
      }
      for (const g of glasses) {
        if (g.held) continue;
        const dx = Math.abs(p.x - g.x), dy = Math.abs(p.y - g.y);
        if (dx < gw * (loose ? 1.45 : 0.8) && dy < gh * (loose ? 1.15 : 0.75) && dx + dy * 0.5 < bd) { bd = dx + dy * 0.5; best = g; }
      }
      return best;
    }
    function release(id) { const o = holds[id]; if (o) { o.held = null; o.byHand = false; o.want = 0; } delete holds[id]; }
    function handle(inputs, t) {
      for (const p of inputs) {
        lastSeen[p.id] = t;
        const was = !!prevDown[p.id];
        // grab when the hand closes near something, or when an already-closed hand moves onto it
        if (p.down && !holds[p.id] && (!was || p.hand)) {
          const o = pick(p);
          if (o) {
            holds[p.id] = o; o.held = p.id; o.byHand = !!p.hand; o.a0 = p.angle || 0;
            o.off.x = o.x - p.x; o.off.y = o.y - p.y; touched = true;
          }
        }
        if (!p.down && was) release(p.id);
        const o = holds[p.id];
        if (o && p.down) {
          if (o.byHand) {
            // snap into the palm, and turn with the hand
            const ty = o.kind === 'bottle' ? -o.bh * 0.08 : 0;
            o.off.x *= 0.8; o.off.y = ty + (o.off.y - ty) * 0.8;
            const da = Math.atan2(Math.sin(p.angle - o.a0), Math.cos(p.angle - o.a0));
            o.want = o.kind === 'bottle' ? clamp(da * 1.3, -2.6, 2.6) : clamp(da * 1.3, -2.2, 2.2);
          }
          o.tx = clamp(p.x + o.off.x, 0, w); o.ty = clamp(p.y + o.off.y, 0, h);

      }
      // a hand that flickers out of view keeps its bottle for a moment; a lifted finger lets go at once
      for (const id of Object.keys(lastSeen)) {
        if (lastSeen[id] === t) continue;
        if (t - lastSeen[id] > (id[0] === 'h' ? 0.35 : 0)) { release(id); delete prevDown[id]; delete lastSeen[id]; }
      }
    }

    const mouthOf = b => ({ x: b.x + Math.sin(b.rot) * b.bh * 0.5, y: b.y - Math.cos(b.rot) * b.bh * 0.5 });
    // a tipped glass spills over the rim corner on the side it leans toward
    const lipOf = g => {
      const lx = Math.sign(g.rot || 1) * gt, ly = -gh / 2, c = Math.cos(g.rot), s = Math.sin(g.rot);
      return { x: g.x + lx * c - ly * s, y: g.y + lx * s + ly * c };
    };
    const surfaceY = g => g.y + gh / 2 - BASE - g.fill * DEPTH;
    // where a stream from point m lands: in a glass below it, or on the table
    function landing(from, m, dir) {
      let g = null;
      for (const gg of glasses) if (gg !== from && Math.abs(m.x - gg.x) < gw * 0.5 && m.y < surfaceY(gg) && Math.abs(gg.rot) < 0.6) { g = gg; break; }
      return {
        g,
        x: g ? clamp(m.x, g.x - gw * 0.32, g.x + gw * 0.32) : m.x + dir * unit * 0.07,
        y: g ? (g.fill >= 1 ? g.y - gh / 2 : surfaceY(g)) : floor

    }
    function addTo(g, add, color, alpha, shares) {
      if (add <= 0) return;
      const tot = g.fill + add;
      for (let c = 0; c < 3; c++) g.color[c] = g.fill > 0 ? (g.color[c] * g.fill + color[c] * add) / tot : color[c];
      g.alpha = g.fill > 0 ? (g.alpha * g.fill + alpha * add) / tot : alpha;
      for (let i = 0; i < DRINKS.length; i++) g.amounts[i] += shares[i] * add;
      g.fill = tot;
    }
    function splash(x, y, color, alpha) {
      if (drops.length < 90 && Math.random() < 0.85) {
        drops.push({ x, y, vx: (Math.random() - 0.5) * unit * 0.9, vy: -Math.random() * unit * 1.2, life: 0.45, c: color.slice(), a: Math.max(0.65, alpha) });
      }
    }
    function scaleGlass(g, keep) {
      g.fill *= keep; g.amounts = g.amounts.map(a => a * keep);

    }
    function mixName(g) {
      const tot = g.amounts.reduce((a, b) => a + b, 0);
      if (tot < 0.04) return '';

        .sort((a, b) => b[0] - a[0]).map(x => x[1]).join(' + ');
    }

    // ---- sound: a soft pouring hiss while liquid flows (live view only) ----
    let pourSrc = null, pourGain = null;
    function pourSound(on) {
      if (demo) return;
      if (!pourGain) {
        if (!on || !soundOn) return;
        const a = audio(); if (!a) return;
        const buf = a.createBuffer(1, a.sampleRate, a.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        pourSrc = a.createBufferSource(); pourSrc.buffer = buf; pourSrc.loop = true;
        const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 750; f.Q.value = 0.8;

    }

    function update(dt) {
      const k = Math.min(1, dt * 16), back = Math.min(1, dt * 7);
      if (!demo) units = Math.max(0, units - dt * 0.012);   // slowly sober up
      for (const o of [...bottles, ...glasses]) {
        if (o.held) { o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k; }
        else { o.x += (o.hx - o.x) * back; o.y += (o.hy - o.y) * back; }
      }
      let anyPour = false;
      for (const b of bottles) {
        b.pouring = false; b.pourInto = null;
        // an empty bottle put back on the table is swapped for a full one a few seconds later
        const home = !b.held && Math.abs(b.x - b.hx) < 2 && Math.abs(b.y - b.hy) < 2;
        b.emptyFor = b.amount <= 0.001 && home ? b.emptyFor + dt : 0;
        if (b.emptyFor > 4) { b.amount = b.d.capacity; b.emptyFor = 0; }

        // drinking straight from the bottle: its mouth is at your mouth, so it needs less tilt and goes into you
        const m = mouthOf(b), atMouth = !!(b.held && nearMouth(m)), startAt = atMouth ? 0.85 : POUR_AT;
        if (Math.abs(b.rot) < startAt || b.amount <= 0.001) continue;
        const strength = clamp((Math.abs(b.rot) - startAt) / 0.6, 0.35, 1);
        const flow = Math.min(b.amount, dt * 0.3 * strength), one = DRINKS.map((_, i) => i === b.di ? 1 : 0);
        b.amount -= flow;
        b.pouring = true; anyPour = true; b.mouth = m; b.scol = b.d.liquid; b.salpha = b.d.alpha;
        if (atMouth) {

        }
        // pouring: the stream falls from the mouth into whatever glass is underneath, or onto the floor
        const L = landing(b, m, Math.sign(b.rot));

        splash(L.x, L.y, b.d.liquid, b.d.alpha);
      }
      for (const g of glasses) {
        g.pouring = false; g.drinking = false;
        // tip a glass to drink by turning your hand. With a mouse or finger it tips by itself:
        // at your mouth when your face is tracked, otherwise when lifted into the upper half of the picture.
        // "at your mouth" means the glass itself is up against your mouth, so nothing spills on the way in
        const atMouth = !!(g.held && face && dist(g, face.mouth) < face.size * 0.9);
        const autoTip = g.held && (face ? atMouth : g.y < h * 0.5);
        const towardMouth = face ? (face.mouth.x < g.x ? -1.7 : 1.7) : (g.x > w / 2 ? -1.7 : 1.7);
        const wantRot = g.byHand ? g.want : autoTip ? towardMouth : 0;
        g.rot += (wantRot - g.rot) * Math.min(1, dt * 6);
        // a fuller glass spills at a smaller tilt. At your mouth the drink goes in; anywhere else it runs over the rim and falls.
        const lip = lipOf(g);
        const spillAt = 0.35 + (1 - g.fill) * 1.15 - (atMouth ? 0.35 : 0);
        if (g.fill > 0.004 && Math.abs(g.rot) > spillAt) {
          const strength = clamp((Math.abs(g.rot) - spillAt) / 0.5, 0.3, 1);

          g.pouring = true; anyPour = true;

            const L = landing(g, lip, Math.sign(g.rot));
            g.landX = L.x; g.landY = L.y;
            if (L.g) addTo(L.g, Math.min(out, 1 - L.g.fill), g.color, g.alpha, shares);
            splash(L.x, L.y, g.color, g.alpha);

          scaleGlass(g, (g.fill - out) / g.fill);
        }
        g.fullFor = g.fill >= 0.999 ? g.fullFor + dt : 0;
        if (demo && g.fullFor > 2.5) scaleGlass(g, Math.max(0, g.fill - dt * 0.6) / g.fill);
        const beer = foamShare(g);
        if (g.fill > 0.05 && Math.random() < dt * (4 + beer * 16)) g.bubbles.push({ x: Math.random() - 0.5, y: 0, r: gw * (0.02 + Math.random() * 0.025), v: 0.18 + Math.random() * 0.25 });
        for (const bb of g.bubbles) bb.y += bb.v * dt;
        g.bubbles = g.bubbles.filter(bb => bb.y < g.fill);
      }
      pourSound(anyPour);
      for (const d of drops) { d.life -= dt; d.x += d.vx * dt; d.y = Math.min(floor, d.y + d.vy * dt); d.vy += unit * 4 * dt; }
      for (let i = drops.length - 1; i >= 0; i--) if (drops[i].life <= 0) drops.splice(i, 1);
    }

    // A drawn bottle: tinted glass, the drink inside at its current level (kept level when tipped), label and cap.
    function drawBottle(b) {
      const d = b.d, s = b.s, { P, bh, bw, hw, nw, top, bot, neckTop } = s;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = bw * 0.3; ctx.shadowOffsetY = bw * 0.06;
      ctx.fillStyle = rgbStr(d.glass, 0.55); ctx.fill(P);
      ctx.shadowColor = 'transparent';
      ctx.save(); ctx.clip(P);
      // the drink: the body holds most of it, so the level is mapped onto the body height
      const frac = clamp(b.amount / d.capacity, 0, 1);
      if (frac > 0.002) {
        const ly = bot - frac * (bot - (s.shoulder - bh * 0.06));

        ctx.rotate(b.rot);

      if (d.crown) {
        ctx.strokeStyle = d.band; ctx.lineWidth = Math.max(1, bw * 0.05);
        ctx.strokeRect(-hw + bw * 0.12, ly0 + lh * 0.12, bw * 0.76, lh * 0.76);
      } else {
        ctx.fillStyle = d.band; ctx.fillRect(-hw, ly0 + lh * 0.78, bw, lh * 0.08);
        ctx.beginPath(); ctx.arc(0, ly0 + lh * 0.24, bw * 0.08, 0, TAU); ctx.fill();
      }
      ctx.fillStyle = d.ink; ctx.font = `800 ${Math.max(6, bw * 0.3)}px ${BODY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.name, 0, ly0 + lh * (d.crown ? 0.52 : 0.56), bw * 0.72);
      // shine
      ctx.fillStyle = 'rgba(255,255,255,.32)'; ctx.fillRect(-hw * 0.66, -bh * 0.22, bw * 0.09, bh * 0.62);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(-nw * 0.55, neckTop + bh * 0.04, nw * 0.35, bh * 0.2);
      ctx.restore();

      ctx.fillStyle = d.cap; ctx.fillRect(-nw * 1.25, top, nw * 2.5, capH);
      ctx.fillStyle = 'rgba(0,0,0,.22)';
      if (d.crown) for (let i = -3; i <= 3; i++) ctx.fillRect(i * nw * 0.36 - bw * 0.006, top + capH * 0.55, Math.max(0.6, bw * 0.02), capH * 0.45);
      else for (let i = 1; i < 4; i++) ctx.fillRect(-nw * 1.25, top + capH * i / 4, nw * 2.5, Math.max(0.5, capH * 0.06));

      ctx.restore();
    }

    function drawGlass(g, t) {
      ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill(GP);
      ctx.save(); ctx.clip(GP);

        // the liquid's surface stays level while the glass tips
        const sy = gh / 2 - BASE - g.fill * DEPTH, tilt = Math.abs(g.rot) < 0.3;
        ctx.rotate(-g.rot);
        const syw = sy * Math.max(0.2, Math.cos(g.rot));
        ctx.fillStyle = rgbStr(g.color, g.alpha); ctx.fillRect(-gh * 1.5, syw, gh * 3, gh * 3);
        ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(-gh * 1.5, syw, gh * 3, Math.max(1, gh * 0.02));
        const beer = foamShare(g);

          const fh = gh * 0.13 * Math.min(1, beer * 1.4) * Math.min(1, g.fill * 3);
          ctx.fillStyle = 'rgba(255,250,238,.95)';
          ctx.fillRect(-gh * 1.5, syw - fh * 0.3, gh * 3, fh);
          for (let i = 0; i < 6; i++) { ctx.beginPath(); ctx.arc(-gt + (i + 0.5) * gw / 6, syw - fh * 0.3 + Math.sin(t * 2 + i) * gh * 0.008, gw * 0.1, 0, TAU); ctx.fill(); }
        }

        if (tilt) {
          ctx.fillStyle = 'rgba(255,255,255,.6)';
          for (const bb of g.bubbles) { ctx.beginPath(); ctx.arc(bb.x * gw * 0.7, gh / 2 - BASE - bb.y * DEPTH, bb.r, 0, TAU); ctx.fill(); }
        }

      ctx.fillStyle = 'rgba(255,255,255,.32)'; ctx.fillRect(-gt * 0.7, -gh * 0.4, gw * 0.08, gh * 0.72);
      ctx.restore();

    }

    // a falling stream from a bottle's mouth or a glass's rim, in that drink's color
    function drawStream(o, t) {
      const m = o.mouth, dir = Math.sign(o.rot), col = o.scol, a = Math.max(0.65, o.salpha);
      ctx.save(); ctx.lineCap = 'round';
      const path = new Path2D();
      path.moveTo(m.x, m.y);
      path.quadraticCurveTo(m.x + dir * unit * 0.08, m.y + (o.landY - m.y) * 0.1, o.landX + Math.sin(t * 40) * unit * 0.006, o.landY);
      ctx.shadowColor = 'rgba(0,0,0,.3)'; ctx.shadowBlur = unit * 0.02;
      ctx.strokeStyle = rgbStr(col, a); ctx.lineWidth = Math.max(1.5, unit * (o.kind === 'glass' ? 0.045 : 0.035)); ctx.stroke(path);
      ctx.shadowBlur = 0;
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = Math.max(0.8, unit * 0.011); ctx.stroke(path);
      ctx.restore();
    }
    function drawTable() {
      ctx.save();

      g.addColorStop(0, 'rgba(48,30,18,.62)'); g.addColorStop(1, 'rgba(20,12,8,.72)');
      ctx.fillStyle = g; ctx.fillRect(0, floor, w, h - floor);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, floor, w, Math.max(1, h * 0.004));
      ctx.restore();
    }
    // live view only: a dotted ring on what an open hand would grab
    let px = 1;   // canvas pixels per screen pixel, so on-screen text stays a normal size
    function drawHelpers(c2, inputs) {
      for (const p of inputs) {
        if (holds[p.id] || !p.hand) continue;
        const o = pick(p);
        if (!o) continue;
        const ow = o.kind === 'bottle' ? o.bw : gw, oh = o.kind === 'bottle' ? o.bh : gh;
        c2.save(); c2.strokeStyle = 'rgba(240,149,60,.95)'; c2.lineWidth = 2.5 * px;
        c2.setLineDash([8 * px, 6 * px]);
        c2.beginPath(); c2.ellipse(o.x, o.y, ow * 0.95, oh * 0.62, 0, 0, TAU); c2.stroke(); c2.restore();
      }
    }

    function drawCursors(c2, inputs) {
      for (const p of inputs) {
        if (!p.pts && !p.down && p.id !== 'demo') continue;
        if (p.pts) {
          c2.strokeStyle = 'rgba(255,255,255,.6)'; c2.lineWidth = 2 * px; c2.beginPath();
          for (const [a, b] of HAND_LINKS) { c2.moveTo(p.pts[a].x, p.pts[a].y); c2.lineTo(p.pts[b].x, p.pts[b].y); }
          c2.stroke();
        }
        const r = demo ? Math.max(5, unit * 0.09) : 16 * px;
        c2.beginPath(); c2.arc(p.x, p.y, r, 0, TAU);
        if (p.down) { c2.fillStyle = 'rgba(240,149,60,.6)'; c2.fill(); }
        c2.lineWidth = demo ? Math.max(1.5, w * 0.008) : 2.5 * px; c2.strokeStyle = '#FFFFFF'; c2.stroke();
      }
    }

    // on-screen tips for the live view
    function tip(inputs) {
      if (camOn && hands.state === 'ready') {
        const handIns = inputs.filter(p => p.hand);
        if (!handIns.length) return 'Show your hand to the camera';
        const held = handIns.map(p => holds[p.id]).find(Boolean);
        if (!held) return handIns.some(p => pick(p)) ? 'Make a fist to grab it' : 'Move your hand to a bottle';
        if (held.kind === 'bottle') {
          if (held.amount <= 0.001) return 'This bottle is empty. Put it back for a full one';
          return held.pouring ? '' : face ? 'Tilt to pour, or drink from the bottle' : 'Tilt your hand to pour';
        }
        if (held.fill <= 0) return 'Fill this glass first';

      }
      return touched ? '' : 'Drag a bottle over a glass to pour';
    }
    function drawTip(c2, text) {
      if (!text) return;
      const fs = 16 * px;
      c2.save();
      c2.font = `600 ${fs}px ${BODY}`; c2.textAlign = 'center'; c2.textBaseline = 'middle';
      const tw = c2.measureText(text).width, x = w / 2, y = 64 * px;
      c2.fillStyle = 'rgba(0,0,0,.55)';
      c2.beginPath();
      if (c2.roundRect) c2.roundRect(x - tw / 2 - fs * 0.9, y - fs * 0.95, tw + fs * 1.8, fs * 1.9, fs * 0.95);

    // ---- the self-playing demo shown on the feed pin ----
    let demoT = 0;
    function demoInput(dt) {
      demoT += dt;
      const cyc = 8, n = Math.floor(demoT / cyc), k = n % bottles.length, u = demoT % cyc;
      const b = bottles[k], g = glasses[(k + Math.floor(n / bottles.length)) % 3];

    // ---- getting drunk: red cheeks first, then sway, double vision, blur and hiccups ----
    function drawBlush() {
      const b = clamp((units - 0.5) / 2, 0, 1);

      const I = drunkness();

        if (nextHic > 0) { hicT = t; if (soundOn) hicSound(); }
        nextHic = t + 5 + Math.random() * 6;
      }
      const hu = (t - hicT) / 0.3, jolt = hu >= 0 && hu < 1 ? -h * 0.03 * Math.sin(Math.PI * hu) : 0;
      if (I > 0.01 || jolt) {
        const tc = tmp.getContext('2d');
        tc.clearRect(0, 0, w, h); tc.drawImage(canvas, 0, 0);
        ctx.save();
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = v; ctx.fillRect(0, 0, w, h);

  // ---------- Hand tracking (MediaPipe), loaded only when a play effect has the live camera ----------

  // gulping and hiccup sounds

    const a = audio(); if (!a) return;
    const t = a.currentTime, o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.12);

  // camera pixels -> effect picture, matching how the camera is cropped and mirrored
  function mapPt(p) {
    const { sx, sy, sw, sh, vw, vh, mirror } = viewSrc.crop, W = viewSrc.w, H = viewSrc.h;
    let x = (p.x * vw - sx) / sw * W;

  // The face tells the effect where your mouth and cheeks are (checked every other frame).

    }

    const up = mapPt(L[13]), lo = mapPt(L[14]), le = mapPt(L[234]), re = mapPt(L[454]);
    return { mouth: { x: (up.x + lo.x) / 2, y: (up.y + lo.y) / 2 }, size: Math.max(1, dist(le, re)), cheeks: [mapPt(L[50]), mapPt(L[280])] };
  }
  async function loadHands() {

        baseOptions: { modelAssetPath: HAND_MODEL, delegate }, runningMode: 'VIDEO', numHands: 2
      });

  function handInputs() {

    const now = performance.now();
    if (now > hands.last + 1) {

    }

    const used = new Set();
    return all.map((L, i) => {
      const pts = L.map(p => {
        let x = (p.x * vw - sx) / sw * W;
        if (mirror) x = W - x;
        return { x, y: (p.y * vh - sy) / sh * H };

      let id = 'h' + side;

  const EFFECTS = [
    { id: 'inuman', name: 'Inuman', sub: 'Grab and pour', make: makeInuman, interactive: true,

  // ---------- picture source: the camera, or a plain backdrop when there is none ----------

  function renderSound() { $('soundBtn').textContent = `Sound: ${soundOn ? 'ON' : 'OFF'}`; }
  $('soundBtn').addEventListener('click', () => { soundOn = !soundOn; store('silverbooth.sound', soundOn ? 'on' : 'off'); renderSound(); if (soundOn) beep(880); });
  $('resetBtn').addEventListener('click', () => { if (viewFx && viewFx.reset) { viewFx.reset(); toast('Bottles refilled, glasses emptied.'); } });
  $('soberBtn').addEventListener('click', () => { if (viewFx && viewFx.soberUp) { viewFx.soberUp(); toast('Sober again.'); } });
  // Add ?debug to the address to read the effect's state from the browser console (used for testing).
  if (/[?&]debug\b/.test(location.search)) {
    window.__silverBooth = { tracking: () => ({ hands: hands.state, face: !!hands.face, faceErr: hands.faceErr || '', faces: hands.faceRes && hands.faceRes.faceLandmarks ? hands.faceRes.faceLandmarks.length : null }), state: () => viewFx && viewFx.state && viewFx.state(), addDrinks: n => viewFx && viewFx.addUnits && viewFx.addUnits(n) };
  }
  $('stripBtn').addEventListener('click', () => {
    if (busy) return;
    strip = !strip;
    $('stripBtn').textContent = `Strip: ${strip ? 'ON' : 'OFF'}`;
    $('stripBtn').setAttribute('aria-pressed', String(strip));
    $('shutter').classList.toggle('strip', strip);
    $('shutter').setAttribute('aria-label', strip ? 'Shoot a strip of four photos' : 'Take a photo');
    toast(strip ? 'Strip: four photos, three seconds apart.' : 'One photo per tap.');
  });
  $('thumbBtn').addEventListener('click', () => { if (captures[0]) openViewer(captures[0]); });

  // ---------- pointer input (mouse, finger, pen) for play effects ----------
  const pointer = { active: false, down: false, x: 0, y: 0 };
  function toCanvas(e) {
    const c = viewFx && viewFx.canvas;
    if (!c) return null;
    const r = c.getBoundingClientRect();
    const s = Math.max(r.width / c.width, r.height / c.height);   // the canvas covers the screen
    return { x: (e.clientX - r.left - (r.width - c.width * s) / 2) / s, y: (e.clientY - r.top - (r.height - c.height * s) / 2) / s };
  }
  stage.addEventListener('pointerdown', e => {
    if (view !== 'effect' || !current || !current.interactive) return;
    const p = toCanvas(e);
    if (!p) return;
    Object.assign(pointer, { active: true, down: true, x: p.x, y: p.y });
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* capture unavailable */ }
    e.preventDefault();
    audio();
  });
  stage.addEventListener('pointermove', e => {
    if (!pointer.active) return;
    const p = toCanvas(e);
    if (p) { pointer.x = p.x; pointer.y = p.y; }
  });
  const pointerUp = () => { pointer.down = false; pointer.active = false; };
  stage.addEventListener('pointerup', pointerUp);
  stage.addEventListener('pointercancel', pointerUp);
  function gatherInputs() {
    const list = handInputs();
    if (pointer.active) list.push({ id: 'p', x: pointer.x, y: pointer.y, down: pointer.down });
    return list;
  }

  // ---------- taking photos and strips ----------
  const countEl = $('count'), flashEl = $('flash'), lampEls = [...document.querySelectorAll('#lamps i')];
  function tick(n) { countEl.textContent = n; countEl.classList.remove('tick'); void countEl.offsetWidth; countEl.classList.add('tick'); }
  function flash() { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
  function snapshot() { const c = mk(viewFx.canvas.width, viewFx.canvas.height); c.getContext('2d').drawImage(viewFx.canvas, 0, 0); return c; }
  function setBusy(on) {
    busy = on;
    $('shutter').disabled = on; $('stripBtn').disabled = on;
    if (!on) { $('lamps').hidden = true; lampEls.forEach(l => l.className = ''); countEl.textContent = ''; }
  }
  async function take() {
    if (busy || view !== 'effect' || !viewFx) return;
    audio();
    if (!strip) {
      const c = snapshot(); shutterSound(); flash();
      addCapture('photo', c, current);
      toast('Photo taken. Tap the picture at the bottom left to see it.');
      return;
    }
    setBusy(true);
    const token = ++stripToken, e = current, frames = [];
    $('lamps').hidden = false;
    for (let i = 0; i < 4; i++) {
      lampEls[i].className = 'now';
      for (let n = 3; n > 0; n--) {
        tick(n); beep(n === 1 ? 1175 : 880);
        await wait(800);
        if (token !== stripToken) return;
      }
      countEl.textContent = '';
      frames.push(snapshot()); shutterSound(); flash();
      lampEls[i].className = 'on';
      await wait(i < 3 ? 650 : 350);
      if (token !== stripToken) return;
    }
    setBusy(false);
    openViewer(addCapture('strip', renderStrip(frames, e), e));
  }
  $('shutter').addEventListener('click', take);

  function coverDraw(ctx, img, dx, dy, dw, dh) {
    const iw = img.width, ih = img.height;
    let sw, sh;
    if (iw / ih > dw / dh) { sh = ih; sw = ih * dw / dh; } else { sw = iw; sh = iw * dh / dw; }
    ctx.drawImage(img, (iw - sw) / 2, (ih - sh) / 2, sw, sh, dx, dy, dw, dh);
  }
  function renderStrip(frames, e) {
    const FW = 480, FH = 360, PAD = 28, GAP = 18, FOOT = 126;
    const SW = FW + PAD * 2, SH = PAD + FH * 4 + GAP * 3 + FOOT;
    const c = mk(SW, SH), x = c.getContext('2d');
    x.fillStyle = '#F6F6F3'; x.fillRect(0, 0, SW, SH);
    frames.forEach((f, i) => coverDraw(x, f, PAD, PAD + i * (FH + GAP), FW, FH));
    stripNo++; store('silverbooth.count', String(stripNo));
    const no = String(stripNo).padStart(4, '0'), d = new Date(), fy = PAD + FH * 4 + GAP * 3;
    x.fillStyle = '#151517'; x.textBaseline = 'alphabetic';
    x.textAlign = 'left'; x.font = `800 46px ${DISPLAY}`; x.fillText('SILVER BOOTH', PAD, fy + 64, FW * 0.7);
    x.textAlign = 'right'; x.font = `500 22px ${MONO}`; x.fillText(`No. ${no}`, SW - PAD, fy + 64);
    x.fillStyle = 'rgba(21,21,23,.66)'; x.font = `500 17px ${MONO}`;
    x.textAlign = 'left'; x.fillText(`${p2(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}  ${p2(d.getHours())}:${p2(d.getMinutes())}`, PAD, fy + 98);
    x.textAlign = 'right'; x.fillText(e.name.toUpperCase(), SW - PAD, fy + 98);
    c.stripNo = no;
    return c;
  }
  function addCapture(kind, canvas, e) {
    const c = { kind, canvas, effect: e, at: new Date(), url: canvas.toDataURL('image/jpeg', 0.9) };
    if (kind === 'strip') { c.label = `Strip ${canvas.stripNo}`; c.file = `silver-booth-strip-${canvas.stripNo}.png`; }
    else { photoCount++; c.label = `Photo ${photoCount}`; c.file = `silver-booth-${p2(photoCount)}.png`; }
    captures.unshift(c);
    renderPhotos();
    return c;
  }

  // ---------- photo viewer ----------
  let viewing = null;
  function askDelete(on) {
    $('delBtn').hidden = on; $('delAsk').hidden = !on; $('delYes').hidden = !on; $('delNo').hidden = !on;
  }
  function openViewer(c) {
    viewing = c;
    $('viewImg').src = c.url; $('viewImg').alt = `${c.label}, made with ${c.effect.name}`;
    const d = c.at;
    $('viewCap').textContent = `${c.label} · ${c.effect.name} · ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    $('viewMsg').textContent = '';
    askDelete(false);
    $('viewer').hidden = false;
    document.documentElement.classList.add('locked');
    $('closeView').focus({ preventScroll: true });
  }
  function closeViewer() {
    $('viewer').hidden = true; viewing = null;
    if (view !== 'effect') document.documentElement.classList.remove('locked');
  }
  $('closeView').addEventListener('click', closeViewer);
  $('delBtn').addEventListener('click', () => askDelete(true));
  $('delNo').addEventListener('click', () => askDelete(false));
  $('delYes').addEventListener('click', () => {
    const i = captures.indexOf(viewing);
    if (i >= 0) captures.splice(i, 1);
    renderPhotos(); closeViewer();
    if (view === 'effect') toast('Photo deleted.');
  });
  const CANT_SAVE = 'Saving isn’t available here. Press and hold (or right-click) the picture to save it.';
  $('saveBtn').addEventListener('click', async () => {
    const c = viewing, msg = $('viewMsg');
    if (!c) return;
    const blob = await new Promise(r => c.canvas.toBlob(r, 'image/png'));
    if (!blob) { msg.textContent = 'That picture couldn’t be prepared. Try again.'; return; }
    if (inViewer) {
      const dl = await downloadsP;
      if (!dl) { msg.textContent = CANT_SAVE; return; }
      try { await dl.save({ filename: c.file, data: blob }); msg.textContent = `Saved ${c.file}.`; }
      catch (e) {
        const code = e && e.code;
        msg.textContent = code === 'declined' ? 'Save cancelled.' : code === 'rate_limited' ? 'A save is already waiting for your answer.' : CANT_SAVE;
      }
    } else {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = c.file;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      msg.textContent = `Saved ${c.file} to your downloads.`;
    }
  });

  // ---------- keyboard ----------
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (!$('viewer').hidden) closeViewer();
      else if (view === 'effect') $('moreBtn').click();
    } else if ((e.code === 'Space' || e.key === ' ') && view === 'effect' && $('viewer').hidden) {
      const tag = e.target && e.target.tagName;
      if (tag !== 'BUTTON' && tag !== 'INPUT') { e.preventDefault(); take(); }
    }
  });

  // ---------- main loop: the camera screen when open, otherwise the home tiles ----------
  let lastTileAt = 0, stillFrames = 0;
  function loop(ts) {
    requestAnimationFrame(loop);
    if (document.hidden) return;
    const t = ts / 1000;
    if (view === 'effect' && viewFx) {
      if (!$('viewer').hidden) return;
      const [w, h] = viewDims();
      if (w !== viewSrc.w || h !== viewSrc.h) buildView();
      drawSource(viewSrc);
      viewFx.step(viewSrc, t, viewFx.interactive ? gatherInputs() : undefined);
      return;
    }
    if (ts - lastTileAt < 50) return;   // home tiles play their demo about 20 times a second
    if (reduceMotion && stillFrames > 45) return;
    lastTileAt = ts; stillFrames++;
    drawSource(tileSrc);
    for (const tl of tiles) tl.fx.step(tileSrc, t);
  }

  // ---------- start ----------
  renderSound();
  renderPhotos();
  fitLogo();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLogo).catch(() => {});
  for (let i = 0; i < 30; i++) { drawSource(tileSrc); for (const tl of tiles) tl.fx.step(tileSrc, i / 20); }
  route();
  requestAnimationFrame(loop);
})();
</script>

</body>
</html>
